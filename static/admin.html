<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PhysLab Админ</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap&subset=cyrillic" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    .adm { display: grid; grid-template-columns: 220px 1fr; gap: 20px; max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; }
    .side { position: sticky; top: 76px; align-self: start; display: grid; gap: 4px; }
    .side a { padding: 10px 14px; border-radius: 12px; color: var(--muted); text-decoration: none; font-weight: 700; }
    .side a.on, .side a:hover { background: rgba(56, 189, 248, .12); color: var(--text); }
    .tbl { overflow-x: auto; }
    .tbl td { vertical-align: top; font-size: .9rem; }
    .tbl tr:hover td { background: rgba(255, 255, 255, .03); }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 99px; font-size: .75rem; font-weight: 700; background: rgba(255, 255, 255, .08); }
    .pill.placement { background: rgba(56, 189, 248, .2); } .pill.exercise { background: rgba(167, 139, 250, .2); } .pill.level_exam { background: rgba(244, 114, 182, .2); }
    .modal { position: fixed; inset: 0; z-index: 60; background: rgba(3, 6, 18, .75); display: grid; place-items: center; padding: 16px; overflow-y: auto; }
    .modal .card { width: min(760px, 100%); max-height: 92vh; overflow-y: auto; background: var(--card-solid); }
    .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
    .bar { height: 12px; border-radius: 99px; background: linear-gradient(90deg, var(--cyan), var(--violet)); }
    .drop { border: 2px dashed var(--line); border-radius: 16px; padding: 30px; text-align: center; transition: border-color .2s, background .2s; }
    .drop.over { border-color: var(--cyan); background: rgba(56, 189, 248, .08); }
    .errrow { color: var(--red); }
    @media (max-width: 800px) { .adm { grid-template-columns: 1fr; } .side { position: static; display: flex; overflow-x: auto; } .f2 { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="logo" href="/admin"><span class="atom">⚛️</span><span>Phys<b>Lab</b> <span class="muted small">Админ</span></span></a>
    <div class="spacer"></div>
    <button class="btn ghost sm" onclick="toggleTheme()">◐</button>
    <a class="btn ghost sm" href="/">Сайт руу</a>
    <button class="btn ghost sm" id="logout">Гарах</button>
  </header>
  <div class="adm">
    <nav class="side" id="side">
      <a href="#dash">📊 Хяналтын самбар</a>
      <a href="#import">📥 Excel импорт</a>
      <a href="#questions">❓ Асуултын сан</a>
      <a href="#lessons">🎬 Хичээлүүд</a>
      <a href="#levels">🪐 Түвшнүүд</a>
      <a href="#users">👥 Сурагчид</a>
      <a href="/#/guide?s=админд" target="_blank">📖 Гарын авлага</a>
    </nav>
    <main id="main"><div class="spinner"></div></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script src="/static/common.js"></script>
  <script src="/static/admin.js"></script>
</body>
</html>
